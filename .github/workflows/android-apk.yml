name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your live Trex address, for example https://yoursite.netlify.app (leave empty to use the saved SITE_URL variable)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the site address
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
        run: |
          echo "Site address: [$SITE_URL]"
          if [ -z "$SITE_URL" ]; then echo "::error::No site address. When you click Run workflow, type your Netlify address (like https://yoursite.netlify.app) in the box."; exit 1; fi
          case "$SITE_URL" in https://*) ;; *) echo "::error::The address must start with https://"; exit 1;; esac
          case "$SITE_URL" in *github.io*) echo "::error::That is a GitHub Pages address. Use your Netlify address instead, because only Netlify runs the Trex server."; exit 1;; esac

      - name: Prepare the Android tools (already installed on GitHub's computers)
        run: |
          echo "Android SDK folder: $ANDROID_HOME"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          else
            echo "::warning::sdkmanager not found, Gradle will fetch what it needs"
          fi
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Load the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::The secret ANDROID_KEYSTORE_B64 is missing. Add it in Settings > Secrets and variables > Actions."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/trex-release.jks"
          test -s "$RUNNER_TEMP/trex-release.jks"

      - name: Build the signed APK
        working-directory: android
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
          KEYSTORE_PATH: ${{ runner.temp }}/trex-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Verify the APK is real and correctly signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build tools: $BT"
          echo "== signature =="; "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          echo "== contents =="; "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|uses-permission|launchable-activity"
          cp "$APK" trex.apk
          ls -la trex.apk

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: trex-apk
          path: trex.apk

      - name: Publish a download page you can open on your phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-build-${{ github.run_number }}" trex.apk \
            --title "Trex Android app (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap trex.apk to download and install. Site: ${{ inputs.site_url || vars.SITE_URL }}"
