<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trex — More</title>
<link rel="stylesheet" href="css/app.css" />
<script src="js/api.js"></script><script src="js/app.js"></script>
<style>.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}.item:last-child{border-bottom:0}.item a{color:var(--blue);font-weight:700;text-decoration:none}</style>
</head>
<body>
<div class="wrap" style="max-width:640px">
  <div class="nav"><b>TREX</b><a href="dashboard.html">Home</a></div>
  <div class="top"><h2 style="margin:0 0 6px">More</h2><div class="muted">Everything you can do in Trex.</div></div>
  <div id="menu"></div>
  <button class="btn btn-line" id="out">Sign out</button>
</div>
<nav class="bottomnav"><a href="dashboard.html">Home</a><a href="trade.html">Trade</a><a href="vendor.html">Become a vendor</a><a href="settings.html">Profile</a><a href="more.html" class="on">More</a></nav>
<script>
function row(t,d,h){return "<div class='item'><span><b>"+t+"</b><br><span class='muted'>"+d+"</span></span><a href='"+h+"'>Open →</a></div>";}
function card(t,rows){return "<div class='card'><b>"+t+"</b>"+rows.join("")+"</div>";}
TREXAPP.ready(function(me){
  var h=[];
  h.push(card("👋 Your account",[row("Dashboard","Balances, converter and transactions","dashboard.html"),row("Notifications","Trades, payments, messages and security","notifications.html"),row("Settings, payout &amp; security","Profile, bank account, face check, support","settings.html")]));
  h.push(card("💱 Trading",[row("Trade &amp; markets","Find an offer and trade in a protected room","trade.html")]));
  if(me.vendor)h.push(card("🏪 Selling",[row("Vendor dashboard","Orders, bond balance and chat","vendor-dashboard.html"),row("Your offers","Build pairs, set rates and limits","offers.html"),row("Your protection (bond)","50% per-trade bond, deposit and withdraw","bond.html")]));
  else h.push(card("🏪 Selling",[row("Become a vendor","What vending means, the 50% rule, do's and don'ts","vendor.html")]));
  if(me.admin)h.push(card("🛡 Operations (Trex team)",[row("Operations centre","Markets, currencies, rates, reviews, vendors","admin.html"),row("Trust &amp; safety checks","Fair pricing and standards","automation.html"),row("Brand sheet","Colours, type, buttons, inputs","design.html")]));
  document.getElementById("menu").innerHTML=h.join("");
});
document.getElementById("out").onclick=function(){API.signOut(false);};
</script>
</body>
</html>
