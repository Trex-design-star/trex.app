<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trex — Sign in</title>
<link rel="stylesheet" href="css/app.css" />
<script src="js/trex.js"></script><script src="js/api.js"></script>
</head>
<body>
<div class="wrap" style="max-width:560px">
  <div class="nav"><b>TREX</b><a href="index.html">Home</a></div>
  <div class="top"><h2 style="margin:0 0 6px">Welcome back</h2><div class="muted">Sign in with your email and password.</div></div>

  <div class="card" id="sIn">
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Your password" />
    <button class="btn btn-blue" id="go">Sign in</button>
    <div class="err" id="err"></div>
    <a href="#" id="forgot" style="font-size:14px;font-weight:600;color:var(--blue);text-decoration:none">Forgot your password?</a>
  </div>

  <div class="card hidden" id="sReset">
    <b>Reset your password</b>
    <p class="muted" id="rNote">Enter your email and we'll send a 6-digit code.</p>
    <label for="rEmail">Email</label><input id="rEmail" type="email" inputmode="email" />
    <button class="btn btn-blue" id="rSend">Send code</button>
    <div class="hidden" id="rStep2">
      <label>6-digit code</label><input id="rCode" inputmode="numeric" maxlength="6" placeholder="123456" />
      <label>New password</label><input id="rPw" type="password" autocomplete="new-password" placeholder="8+ characters, a letter and a number" />
      <button class="btn btn-black" id="rGo">Save new password</button>
    </div>
    <div class="err" id="rErr"></div>
    <button class="btn btn-line" id="rBack">← Back to sign in</button>
  </div>

  <div class="card" style="text-align:center"><span class="muted">New to Trex?</span><a class="btn btn-line" href="onboarding.html">Create a free account</a></div>
</div>
<script>
var $=function(i){return document.getElementById(i);};
function nextUrl(){var n=new URLSearchParams(location.search).get("next")||"";return /^[a-z0-9_-]+\.html(\?[a-z0-9=&_.%-]*)?$/i.test(n)?n:"dashboard.html";}
if(API.token()){location.replace(nextUrl());}
$("go").onclick=function(){
  var em=$("email").value.trim().toLowerCase(),pw=$("pw").value;$("err").textContent="";
  if(em.indexOf("@")<1||!pw){$("err").textContent="Enter your email and password.";return;}
  $("go").disabled=true;$("go").textContent="Signing in…";
  API.post("/login",{email:em,password:pw}).then(function(r){
    $("go").disabled=false;$("go").textContent="Sign in";
    if(r&&r.ok&&r.token){try{localStorage.setItem("trex_session",r.token);localStorage.setItem("trex_email",em);}catch(e){}location.href=nextUrl();return;}
    if(r&&r.unverified){location.href="onboarding.html?verify="+encodeURIComponent(em);return;}
    $("err").textContent=(r&&r.error)||"Couldn't sign in. Try again.";
  }).catch(function(){$("go").disabled=false;$("go").textContent="Sign in";$("err").textContent="No connection. Check your internet and try again.";});
};
$("pw").onkeydown=$("email").onkeydown=function(e){if(e.key==="Enter")$("go").onclick();};
$("forgot").onclick=function(e){e.preventDefault();$("sIn").classList.add("hidden");$("sReset").classList.remove("hidden");$("rEmail").value=$("email").value;};
$("rBack").onclick=function(){$("sReset").classList.add("hidden");$("sIn").classList.remove("hidden");};
$("rSend").onclick=function(){
  var em=$("rEmail").value.trim().toLowerCase();$("rErr").textContent="";if(em.indexOf("@")<1){$("rErr").textContent="Enter a valid email.";return;}
  API.post("/reset/request",{email:em}).then(function(r){
    if(r&&r.ok){$("rStep2").classList.remove("hidden");$("rNote").textContent="If an account exists for "+em+", a code is on its way. Check your inbox and spam folder.";}
    else $("rErr").textContent=(r&&r.error)||"Couldn't send the code.";});
};
$("rGo").onclick=function(){
  $("rErr").textContent="";
  API.post("/reset/confirm",{email:$("rEmail").value.trim().toLowerCase(),code:$("rCode").value.trim(),password:$("rPw").value}).then(function(r){
    if(r&&r.ok){$("sReset").classList.add("hidden");$("sIn").classList.remove("hidden");$("email").value=$("rEmail").value;$("pw").value="";$("err").style.color="#027A48";$("err").textContent="Password changed. Sign in with your new password.";}
    else $("rErr").textContent=(r&&r.error)||"Couldn't reset the password.";});
};
</script>
</body>
</html>
