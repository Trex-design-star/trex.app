services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trex
      POSTGRES_PASSWORD: trex
      POSTGRES_DB: trex
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
