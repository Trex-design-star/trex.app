<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trex — Trade</title>
<link rel="stylesheet" href="css/app.css" />
<script src="js/trex.js"></script><script src="js/api.js"></script><script src="js/chat.js"></script><script src="js/app.js"></script>
<style>.offer{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.vrow{display:flex;gap:10px;align-items:center}.vrow img,.vrow .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover}.shield{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:800;border-radius:999px;padding:6px 14px;font-size:13px}.pay{background:#F7F4EF;border:1px dashed #C9BFA8;border-radius:12px;padding:12px;margin:10px 0;white-space:pre-line;font-size:14px}.receipt{background:#0B0D12;color:#fff;border-radius:12px;padding:14px;font-size:13px;margin-top:10px}</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><b>TREX</b><span><a href="dashboard.html">Home</a><a href="settings.html">Settings</a></span></div>

  <div id="marketView">
    <div class="card"><b>Find an offer</b>
      <div class="grid"><div><label>I want to pay with</label><select id="sellCur"></select></div><div><label>I want to receive</label><select id="recvCur"></select></div></div>
      <div class="muted" id="pairState"></div>
      <div class="btnrow"><button class="btn small" id="findBtn">Find offers</button></div></div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Offers</b><select id="sort" style="width:auto"><option value="rec">Recommended</option><option value="rate">Best rate</option></select></div><div id="offers"><p class="muted">Loading…</p></div></div>
  </div>

  <div id="tradeView" class="hidden">
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b id="tTitle">Trade</b><span id="tState" class="badge b-blue">…</span></div>
      <div style="margin:8px 0"><span class="shield">🛡 BOND-PROTECTED TRADE</span></div>
      <div class="vrow" id="tVendor"></div>
      <div id="tSummary" style="font-size:14px;margin-top:10px"></div>
      <div id="tPay" class="pay hidden"></div>
      <div id="payBox" class="hidden"><label>Payment receipt reference</label><input id="proof" placeholder="e.g. transfer reference or receipt number" /><button class="btn btn-blue" id="btnPay">I've sent payment</button></div>
      <button class="btn btn-black hidden" id="btnComplete">Confirm I received it &amp; complete</button>
      <div class="btnrow"><button class="btn small line hidden" id="btnDispute">Report a problem</button><button class="btn small line hidden" id="btnCancel">Cancel trade</button><button class="btn small line" id="btnBack">Back to market</button></div>
      <div id="chatMount" style="margin-top:12px"></div>
      <div id="rateBox" class="hidden" style="margin-top:10px"><label>How was your vendor?</label><select id="rating"><option value="5">5 ★★★★★</option><option value="4">4 ★★★★</option><option value="3">3 ★★★</option><option value="2">2 ★★</option><option value="1">1 ★</option></select><button class="btn btn-blue" id="submitRating">Submit rating</button></div>
      <div class="receipt hidden" id="receipt"></div>
    </div>
  </div>
</div>

<div class="modal" id="reqModal"><div class="sheet">
  <b id="rTitle">Request a trade</b><div class="muted" id="rInfo"></div>
  <label id="rPayLab">You pay</label><input id="rPay" type="number" min="0" step="any" />
  <div style="margin-top:6px;font-size:15px">You receive: <b id="rGet">—</b></div><div class="muted" id="rHint"></div>
  <label id="rRecvLab">Where should the vendor send your currency?</label><textarea id="rDetails" rows="2" placeholder="Bank name, account number and name — or PayPal/wallet email"></textarea>
  <div class="muted">The vendor sees this only after accepting. They pay the 1.5% platform fee, not you.</div>
  <button class="btn btn-blue" id="rGo">Send trade request</button><button class="btn btn-line" id="rClose">Close</button><div class="err" id="rErr"></div>
</div></div>
<div class="modal" id="vModal"><div class="sheet"><div id="vBody"></div><button class="btn btn-line" id="vClose">Close</button></div></div>
<nav class="bottomnav"><a href="dashboard.html">Home</a><a href="trade.html" class="on">Trade</a><a href="vendor.html">Become a vendor</a><a href="settings.html">Profile</a><a href="more.html">More</a></nav>
<div class="toast" id="toast"></div>
<script>
var $=function(i){return document.getElementById(i);},esc=function(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._x);t._x=setTimeout(function(){t.style.display="none";},3000);}
var offers=[],sel=null,cur=null,chat=null,rated=false;
function opts(sel,val){sel.innerHTML="";TREX.CURRENCIES.forEach(function(c){var o=document.createElement("option");o.value=c.code;o.textContent=c.flag+" "+c.code;sel.appendChild(o);});sel.value=val;}
function avatar(o){return o.photo?"<img src='"+esc(o.photo)+"' alt=''>":"<span class='avatar'>"+esc((o.vendor||"?").charAt(0).toUpperCase())+"</span>";}
function find(){
  var s=$("sellCur").value,r=$("recvCur").value;
  if(s===r){$("pairState").textContent="Pick two different currencies.";$("offers").innerHTML="";return;}
  var st=TREX.pairStatus(s,r);if(st!=="LIVE"){$("pairState").textContent=s+"/"+r+" is "+st.toLowerCase()+" right now.";$("offers").innerHTML="<p class='muted'>This market isn't available at the moment.</p>";return;}
  var ref=TREX.refRate(r,s);$("pairState").textContent="Market: 1 "+r+" ≈ "+(ref?TREX.fmt(ref,s):"—");
  var l=offers.filter(function(o){return o.provide===r&&o.want===s&&o.live!==false;});
  l.sort(function(a,b){if($("sort").value==="rate")return a.rate-b.rate;var sa=(a.tier==="Gold"?100:0)+(TREX.parseVendor(a.vendor).rating||0)*10,sb=(b.tier==="Gold"?100:0)+(TREX.parseVendor(b.vendor).rating||0)*10;return sb-sa;});
  var box=$("offers");box.innerHTML="";
  if(!l.length){box.innerHTML="<p class='muted'>No vendors are offering this pair right now. Check back soon or try another pair.</p>";return;}
  l.forEach(function(o){
    var d=document.createElement("div");d.className="offer";
    d.innerHTML="<div class='vrow'>"+avatar(o)+"<div style='flex:1'><b>"+esc(TREX.parseVendor(o.vendor).name)+"</b> <span class='badge "+(o.tier==="Gold"?"b-blue":"b-brown")+"'>"+(o.tier==="Gold"?"Top vendor":"New vendor")+"</span><div class='muted'>★ "+esc(TREX.parseVendor(o.vendor).rating||"new")+" • "+esc(TREX.parseVendor(o.vendor).trades)+" trades"+(o.pledge?" • replies "+esc(o.pledge):"")+"</div></div></div>"
      +"<div style='margin-top:8px'>Rate: <b>"+esc(TREX.fmt(o.rate,s))+"</b> per "+esc(r)+"</div><div class='muted'>Limits "+esc(o.min)+"–"+esc(o.max)+" "+esc(r)+" • "+esc((o.methods||[]).join(", "))+"</div>";
    var vb=document.createElement("button");vb.className="btn small line";vb.textContent="Vendor profile";vb.onclick=function(){showVendor(o);};
    var b=document.createElement("button");b.className="btn btn-blue";b.textContent="Trade with this vendor";b.onclick=function(){openReq(o);};
    d.appendChild(vb);d.appendChild(b);box.appendChild(d);
  });
}
function showVendor(o){
  $("vBody").innerHTML="<p class='muted'>Loading…</p>";$("vModal").style.display="flex";
  API.get("/profile/public?uid="+encodeURIComponent(o.vuid)).then(function(r){
    if(!r||!r.ok){$("vBody").innerHTML="<p class='muted'>Couldn't load this profile.</p>";return;}var p=r.profile,g=TREX.getCountry(p.country);
    $("vBody").innerHTML="<div class='vrow'>"+(p.avatar?"<img src='"+esc(p.avatar)+"' alt='' style='width:64px;height:64px'>":"<span class='avatar' style='width:64px;height:64px'>"+esc(p.name.charAt(0))+"</span>")+"<div><b style='font-size:18px'>"+esc(p.name)+"</b><div class='muted'>"+(g?g.flag+" "+esc(g.name):"")+" • member since "+esc(new Date(p.since).toLocaleDateString())+"</div></div></div>"
      +(p.bio?"<p>"+esc(p.bio)+"</p>":"")+"<div class='grid'><div class='cap'><div class='muted'>Completed trades</div><b style='font-size:20px'>"+p.completed+"</b></div><div class='cap'><div class='muted'>Rating</div><b style='font-size:20px'>"+(p.rating==null?"New":"★ "+p.rating)+"</b><div class='muted'>"+p.rated+" review"+(p.rated===1?"":"s")+"</div></div></div>"
      +"<div class='muted' style='margin-top:8px'>"+(p.pledge?"Replies "+esc(p.pledge)+"<br>":"")+(p.langs?"Speaks "+esc(p.langs)+"<br>":"")+"Disputes: "+p.disputes+"</div>";});
}
$("vClose").onclick=function(){$("vModal").style.display="none";};
function recompute(){
  if(!sel)return;var pay=Number($("rPay").value)||0,get=Math.round(pay/sel.rate*100)/100;
  $("rGet").textContent=pay>0?TREX.fmt(get,sel.provide):"—";
  var bad=pay>0&&(get<sel.min||get>sel.max);$("rHint").textContent="Limits: "+sel.min+"–"+sel.max+" "+sel.provide+(bad?" — outside this vendor's limits":"");$("rHint").style.color=bad?"#D92D20":"";
}
function openReq(o){
  sel=o;$("rErr").textContent="";$("rTitle").textContent="Trade with "+TREX.parseVendor(o.vendor).name;$("rInfo").textContent="Rate: "+TREX.fmt(o.rate,o.want)+" per "+o.provide;
  $("rPayLab").textContent="You pay ("+o.want+")";$("rRecvLab").textContent="Where should the vendor send your "+o.provide+"?";$("rPay").value="";$("rGet").textContent="—";$("reqModal").style.display="flex";recompute();
}
$("rPay").oninput=recompute;$("rClose").onclick=function(){$("reqModal").style.display="none";};
$("rGo").onclick=function(){
  var pay=Number($("rPay").value)||0,get=Math.round(pay/sel.rate*100)/100;$("rErr").textContent="";
  if(!(pay>0)){$("rErr").textContent="Enter how much you want to pay.";return;}
  if(get<sel.min||get>sel.max){$("rErr").textContent="Amount is outside this vendor's limits ("+sel.min+"–"+sel.max+" "+sel.provide+").";return;}
  if($("rDetails").value.trim().length<5){$("rErr").textContent="Tell the vendor where to send your "+sel.provide+".";return;}
  $("rGo").disabled=true;
  API.post("/trades",{offer_id:sel.id,sell:sel.want,recv:sel.provide,amount:get,receive_details:$("rDetails").value.trim()},API.key()).then(function(r){
    $("rGo").disabled=false;
    if(r&&r.ok){$("reqModal").style.display="none";showTrade(r.trade);}else $("rErr").textContent=(r&&r.error)||"Couldn't send the request.";
  }).catch(function(){$("rGo").disabled=false;$("rErr").textContent="No connection. Try again.";});
};
var MAP={awaiting_vendor:["Waiting for vendor to accept","b-brown"],awaiting_bond:["Vendor is securing the bond","b-brown"],opened:["Accepted — send your payment","b-blue"],payment_sent:["Payment sent — waiting for vendor","b-blue"],payment_confirmed:["Payment confirmed — vendor sending","b-blue"],delivery_sent:["Delivered — please confirm","b-brown"],completed:["Completed","b-green"],cancelled:["Cancelled","b-red"],disputed:["Under review","b-red"],resolved:["Resolved","b-blue"]};
function vis(id,on){$(id).classList.toggle("hidden",!on);}
function render(){
  var t=cur,s=t.state,m=MAP[s]||[s,"b-blue"];
  $("tTitle").textContent=t.id;$("tState").textContent=m[0];$("tState").className="badge "+m[1];
  $("tVendor").innerHTML=(t.with&&t.with.avatar?"<img src='"+esc(t.with.avatar)+"' alt=''>":"<span class='avatar'>"+esc(((t.with&&t.with.name)||"V").charAt(0))+"</span>")+"<div><b>"+esc(t.with?t.with.name:t.vendor)+"</b><div class='muted'>Your vendor</div></div>";
  var pay=Math.round(t.amount*t.rate*100)/100;
  $("tSummary").innerHTML="You pay <b>"+esc(TREX.fmt(pay,t.want))+"</b> → you receive <b>"+esc(TREX.fmt(t.amount,t.provide))+"</b><br><span class='muted'>Rate "+esc(TREX.fmt(t.rate,t.want))+" per "+esc(t.provide)+" • platform fee is paid by the vendor</span>";
  if(t.pay_details&&["opened","payment_sent","payment_confirmed","delivery_sent"].indexOf(s)>=0){$("tPay").innerHTML="<b>Pay exactly "+esc(TREX.fmt(pay,t.want))+" to:</b><br>"+esc(t.pay_details);vis("tPay",true);}else vis("tPay",false);
  vis("payBox",s==="opened");vis("btnComplete",s==="delivery_sent");
  vis("btnCancel",["awaiting_vendor","awaiting_bond","opened"].indexOf(s)>=0);vis("btnDispute",["payment_sent","payment_confirmed","delivery_sent"].indexOf(s)>=0);
  vis("rateBox",s==="completed"&&!rated);
  if(s==="completed"){$("receipt").innerHTML="<b>TRADE COMPLETE ✓</b><br>"+esc(t.id)+" • "+esc(TREX.localTime(t.updated_at))+"<br>You paid "+esc(TREX.fmt(pay,t.want))+" • You received "+esc(TREX.fmt(t.amount,t.provide))+"<br>Vendor: "+esc(t.vendor);vis("receipt",true);}else vis("receipt",false);
}
function showTrade(t){
  if(t.role==="vendor"){location.replace("vendor-dashboard.html?open="+encodeURIComponent(t.id));return;}
  cur=t;rated=false;$("marketView").classList.add("hidden");$("tradeView").classList.remove("hidden");render();
  if(chat)chat.stop();$("chatMount").innerHTML="";
  chat=Chat.mount($("chatMount"),t.id,{title:"Chat",quick:["I've sent payment","Please confirm receipt","Thank you!"],onState:function(s){if(cur&&s!==cur.state){API.get("/trades").then(function(r){var n=r&&r.ok&&r.trades.filter(function(x){return x.id===cur.id;})[0];if(n){cur=n;render();}});}}});
  history.replaceState(null,"","trade.html?open="+encodeURIComponent(t.id));
}
function act(a,extra){return API.post("/trade_action",Object.assign({id:cur.id,action:a},extra||{}),API.key()).then(function(r){if(r&&r.ok){cur=r.trade;render();}else toast((r&&r.error)||"Couldn't update the trade.");return r;});}
$("btnPay").onclick=function(){if(!$("proof").value.trim()){toast("Add your payment receipt reference first.");return;}act("pay",{proof:$("proof").value.trim()});};
$("btnComplete").onclick=function(){if(confirm("Only confirm if you have received the full amount."))act("complete");};
$("btnCancel").onclick=function(){if(confirm("Cancel this trade?"))act("cancel");};
$("btnDispute").onclick=function(){if(confirm("Report a problem? The trade will be paused for review."))act("dispute");};
$("btnBack").onclick=function(){if(chat){chat.stop();chat=null;}history.replaceState(null,"","trade.html");$("tradeView").classList.add("hidden");$("marketView").classList.remove("hidden");load();};
$("submitRating").onclick=function(){API.post("/ratings",{trade:cur.id,rating:$("rating").value}).then(function(r){toast(r&&r.ok?"Thanks — your rating helps other traders.":(r&&r.error)||"Couldn't save.");if(r&&r.ok){rated=true;vis("rateBox",false);}});};
$("findBtn").onclick=find;$("sort").onchange=find;$("sellCur").onchange=$("recvCur").onchange=find;
function load(){API.get("/offers").then(function(r){offers=(r&&r.ok&&r.offers)||[];find();});}
TREXAPP.ready(function(me){
  var q=new URLSearchParams(location.search),g=TREX.getCountry(me.country)||{currency:"NGN"};
  opts($("sellCur"),q.get("send")||g.currency);opts($("recvCur"),q.get("recv")||(g.currency==="USD"?"EUR":"USD"));
  if(q.get("open")){API.get("/trades").then(function(r){var t=r&&r.ok&&r.trades.filter(function(x){return x.id===q.get("open");})[0];if(t)showTrade(t);else toast("Trade not found.");});}
  load();setInterval(function(){if(!cur)load();},20000);
});
</script>
</body>
</html>
