<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trex — Launch checklist</title>
<style>
  :root{--black:#0B0D12;--blue:#155EEF;
    --ink:#0B0D12;--muted:#4B5563;--bg:#2A0A54;--card:#fff;--line:#E4E0D6;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:16px 14px 48px}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 12px;font-size:14px}
  .nav b{letter-spacing:.08em;color:#fff}
  .nav a{color:#B9CCFF;text-decoration:none;font-weight:600}
  .top{background:var(--black);color:#fff;border-radius:var(--radius);padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
  .muted{color:var(--muted);font-size:13px}
  .ok{color:#027A48;font-weight:700}.no{color:#D92D20;font-weight:700}
  label{display:block;font-size:14px;margin:8px 0}
  .btn{width:100%;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;background:var(--blue);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><b>TREX OPERATIONS</b><span><a href="index.html">Storefront</a> • <a href="more.html">All pages</a></span></div>
  <div class="top">
    <h2 style="margin:0 0 6px">Launch checklist</h2>
    <div class="muted" style="color:#C7CBD1">Nothing goes public until every box is ticked</div>
  </div>
  <div class="card">
    <label><input type="checkbox" checked> Trades feel instant on every Android phone, even on slow networks</label>
    <label><input type="checkbox" checked> Every money event is traceable; every team action is recorded</label>
    <label><input type="checkbox" id="g1"> Legal sign-off on holding vendor bonds in Nigeria</label>
    <label><input type="checkbox" id="g2"> Live payment keys secured; a full week of clean daily checks</label>
    <label><input type="checkbox" id="g3"> Private beta targets met: 97% smooth trades, 45-minute median, reviews within 24 hours</label>
    <label><input type="checkbox" id="g4"> Pricing, limits and backstop decisions finalized</label>
    <button class="btn" id="go">Check readiness</button>
    <div class="muted" id="out"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
$("go").onclick=()=>{
  const missing=["g1","g2","g3","g4"].filter(id=>!$(id).checked);
  $("out").innerHTML=missing.length?`<span class="no">Not yet:</span> ${missing.length} item(s) still open — stay in beta.`
    :`<span class="ok">Ready:</span> all clear — open to the public.`;
};
</script>
</body>
</html>
